[PHP]
; Enable error reporting for development
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "D:\Proyectos_Dev\hr_dispon\php_errors.log"

; Enable SQLite3
extension_dir = "D:\php-8.4.12\ext"
extension=sqlite3
extension=pdo_sqlite

; General settings
max_execution_time = 30
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M